name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen  # no desktop on the runner; GUI tests render off screen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Unit, integration, GUI and scenario tests (no phone; real-device tests are marked "device")
        run: python -m pytest -q -p no:cacheprovider --junitxml=test-results.xml

      - name: Skill files are valid
        shell: pwsh
        run: Get-ChildItem skills -Recurse -Filter *.yaml | ForEach-Object { python -m phonepilot skill validate $_.FullName; if ($LASTEXITCODE) { exit 1 } }

      - name: MCP tool reference is up to date
        run: |
          python scripts/gen_tool_reference.py
          git diff --exit-code -- docs/MCP_TOOLS.md

      - name: Keep personal data out of the repository
        shell: pwsh
        run: |
          $bad = git ls-files | Select-String -Pattern '(^|/)(\.env|gesture_profiles\.yaml|approved_skills\.json|mcp\.token|incidents\.jsonl)$|(^|/)recordings?/|(^|/)recorded/|\.recording\.yaml$'
          if ($bad) { Write-Error "personal data is tracked: $bad"; exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
