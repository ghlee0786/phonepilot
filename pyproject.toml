[project]
name = "phonepilot"
version = "0.1.3"
description = "AI-assisted Android mirroring and control platform with secret isolation and human approval gates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "av>=12",
    "numpy>=1.26",
    "Pillow>=10",
    "adbutils>=2.8",
    "mcp>=2.3",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "anthropic>=0.40",
    "tzdata>=2024.1",
    "qrcode>=7.4",
]

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime>=1.3"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-qt>=4.4",
    "hypothesis>=6.100",
]
build = [
    "pyinstaller>=6.10",
]

[project.scripts]
phonepilot = "phonepilot.__main__:main"
phonepilot-mcp = "phonepilot.agent.stdio_shim:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phonepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "device: requires a real Android device connected over adb",
]
addopts = "-m 'not device'"
qt_api = "pyside6"

